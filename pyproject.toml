[project]
name = "incident-desk"
version = "0.1.0"
description = "On-call incident investigator with a resumable agent loop and an operator console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["incident_desk*"]

[tool.setuptools.package-data]
incident_desk = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
